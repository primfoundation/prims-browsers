# Five tenant jars. Greenmark stays on the existing logged-in box
# (the sample jar). These four are new.
#
#   docker compose -f jars/compose.yaml up -d --build
#
# Host binds are loopback only. Profiles live under ~/.prim/prims-browsers/jars.

name: prims-browsers

x-jar: &jar
  build: .
  shm_size: 512mb
  restart: unless-stopped
  environment:
    KEEP_APP_RUNNING: "1"
    CHROMIUM_REMOTE_DEBUGGING: "1"
    CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
    DISPLAY_WIDTH: "1920"
    DISPLAY_HEIGHT: "1080"
    USER_ID: "1000"
    SECURE_CONNECTION: "0"
  security_opt:
    - no-new-privileges:true

services:
  eidos:
    <<: *jar
    container_name: prims-browsers-eidos
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.com"
    ports:
      - "127.0.0.1:15801:5800"
      - "127.0.0.1:19221:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/eidos:/config

  aic:
    <<: *jar
    container_name: prims-browsers-aic
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.org"
    ports:
      - "127.0.0.1:15803:5800"
      - "127.0.0.1:19223:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/aic:/config

  arp:
    <<: *jar
    container_name: prims-browsers-arp
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.net"
    ports:
      - "127.0.0.1:15804:5800"
      - "127.0.0.1:19224:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/arp:/config

  reeves:
    <<: *jar
    container_name: prims-browsers-reeves
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.com"
    ports:
      - "127.0.0.1:15805:5800"
      - "127.0.0.1:19225:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/reeves:/config
