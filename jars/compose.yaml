# Sample jars for local multi-tenant. Plugin installs often run one jar only.
#
#   docker compose -f jars/compose.yaml up -d --build
#
# Host binds are loopback only. Profiles: ~/.prim/prims-browsers/jars/<id>
# Copy a service block to add more sandboxes. Keep private fleets in
# jars/compose.local.yaml (gitignored).

name: prims-browsers

x-jar: &jar
  build: .
  shm_size: 512mb
  restart: unless-stopped
  environment:
    KEEP_APP_RUNNING: "1"
    CHROMIUM_REMOTE_DEBUGGING: "1"
    CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
    DISPLAY_WIDTH: "1920"
    DISPLAY_HEIGHT: "1080"
    USER_ID: "1000"
    SECURE_CONNECTION: "0"
  security_opt:
    - no-new-privileges:true

services:
  alpha:
    <<: *jar
    container_name: prims-browsers-alpha
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.com/"
    ports:
      - "127.0.0.1:15801:5800"
      - "127.0.0.1:19221:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/alpha:/config

  beta:
    <<: *jar
    container_name: prims-browsers-beta
    environment:
      KEEP_APP_RUNNING: "1"
      CHROMIUM_REMOTE_DEBUGGING: "1"
      CHROMIUM_REMOTE_DEBUGGING_PORT: "9222"
      DISPLAY_WIDTH: "1920"
      DISPLAY_HEIGHT: "1080"
      USER_ID: "1000"
      SECURE_CONNECTION: "0"
      CHROMIUM_CUSTOM_ARGS: "--test-type --no-first-run --no-default-browser-check --disable-gpu --disable-gpu-compositing --disable-accelerated-2d-canvas --disable-features=PasswordManagerOnboarding,PasswordGeneration --start-maximized https://example.org/"
    ports:
      - "127.0.0.1:15802:5800"
      - "127.0.0.1:19222:9222"
    volumes:
      - ${HOME}/.prim/prims-browsers/jars/beta:/config
