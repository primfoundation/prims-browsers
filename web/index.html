<!DOCTYPE html>
<html lang="en" data-palette="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prims Browsers</title>
  <link rel="icon" href="/brand/assets/logos/folio-gold.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/brand/kit.css">
  <link rel="stylesheet" href="/desk.css">
</head>
<body>
  <aside class="rail" aria-label="Tenants">
    <div class="mark">
      <img src="/brand/assets/logos/folio-gold.svg" width="28" height="28" alt="">
      <p class="kicker">Prims Browsers</p>
    </div>
    <p class="sub">The glass is a view. Close it; the jar stays.</p>
    <ul id="rail"></ul>
    <p class="foot" id="source"></p>
  </aside>
  <main class="stage">
    <header class="stage-bar">
      <div>
        <h1 id="title">Pick a tenant</h1>
        <p id="meta" class="meta"></p>
      </div>
      <div class="acts">
        <button type="button" id="watch" hidden>Open in its own tab</button>
        <button type="button" id="close" hidden>Close this view</button>
      </div>
    </header>
    <div id="empty" class="empty">Five desks. Click Greenmark to put the glass here.</div>
    <iframe id="glass" title="Tenant Chromium"></iframe>
  </main>
  <script src="/desk.js"></script>
</body>
</html>
